name: Package

# Triggered when a release tag is pushed (e.g. v0.8.2).
# Builds distributable installers for Windows, macOS, and Linux,
# then publishes them — plus the auto-updater metadata (latest.yml) —
# directly to the GitHub Release via electron-builder --publish always.
#
# Required GitHub secrets:
#   (none for unsigned builds — GITHUB_TOKEN is provided automatically)
#   APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID  — macOS notarisation (optional)
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD            — Windows code signing (optional)
#
# Produced release assets (stable download URLs via /releases/latest/download/):
#   Knovex-Setup-<version>.exe          Windows NSIS installer
#   latest.yml                          Windows auto-updater metadata
#   Knovex-<version>.dmg                macOS DMG
#   latest-mac.yml                      macOS auto-updater metadata
#   Knovex-<version>.AppImage           Linux AppImage (portable)
#   latest-linux.yml                    Linux auto-updater metadata
#   knovex_<version>_amd64.deb          Linux Debian package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ─── Build on each target platform ──────────────────────────────────────────
  build:
    permissions:
      contents: write   # electron-builder --publish always needs this to upload release assets

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_glob: "desktop/release/*.exe"
            artifact_name: knovex-windows-installer
            backend_exe: backend/dist/knovex-backend/knovex-backend.exe

          - os: macos-latest
            platform: mac
            artifact_glob: "desktop/release/*.dmg"
            artifact_name: knovex-macos-dmg
            backend_exe: backend/dist/knovex-backend/knovex-backend

          - os: ubuntu-latest
            platform: linux
            artifact_glob: "desktop/release/*.AppImage"
            artifact_name: knovex-linux-appimage
            backend_exe: backend/dist/knovex-backend/knovex-backend

          - os: ubuntu-latest
            platform: linux-deb
            artifact_glob: "desktop/release/*.deb"
            artifact_name: knovex-linux-deb
            backend_exe: backend/dist/knovex-backend/knovex-backend

    runs-on: ${{ matrix.os }}
    name: Package — ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python backend binary ──────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies + PyInstaller
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt pyinstaller

      - name: Build backend binary (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller backend/knovex-backend.spec \
            --distpath backend/dist \
            --workpath backend/build \
            --noconfirm
        env:
          PYTHONUNBUFFERED: "1"

      # ── CRITICAL: fail loudly if binary was not produced ──────────────────
      - name: Verify backend binary exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.backend_exe }}" ]; then
            echo "ERROR: Backend binary not found at ${{ matrix.backend_exe }}"
            echo "PyInstaller output directory contents:"
            ls -la backend/dist/ 2>/dev/null || echo "(dist/ does not exist)"
            exit 1
          fi
          echo "Backend binary OK: ${{ matrix.backend_exe }}"
          ls -lh "${{ matrix.backend_exe }}"
          echo "Full backend bundle:"
          ls -la backend/dist/knovex-backend/

      # ── Frontend build ────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm ci && npm run build

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux build deps
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libxtst6 libx11-xcb1 libxcb-dri3-0 \
            libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      # ── Electron packaging ────────────────────────────────────────────────
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # --publish always  →  electron-builder uploads installer + latest*.yml
      # to the GitHub Release automatically, enabling electron-updater auto-update.
      # Wrapped in scripts/retry.sh (3 attempts, linear backoff): electron-builder
      # downloads helper binaries from GitHub's CDN at build time; a transient 504
      # there failed the v0.12.4 Linux job. Retrying absorbs CDN blips so a release
      # doesn't need a manual re-run. shell: bash so the wrapper is portable to the
      # Windows runner.
      - name: Package with electron-builder (AppImage)
        if: matrix.platform == 'linux'
        working-directory: desktop
        shell: bash
        run: bash ../scripts/retry.sh 3 -- npx electron-builder --linux AppImage --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package with electron-builder (deb)
        if: matrix.platform == 'linux-deb'
        working-directory: desktop
        shell: bash
        run: bash ../scripts/retry.sh 3 -- npx electron-builder --linux deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package with electron-builder (win/mac)
        if: "!startsWith(matrix.platform, 'linux')"
        working-directory: desktop
        shell: bash
        run: bash ../scripts/retry.sh 3 -- npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # ── Verify installer was produced ─────────────────────────────────────
      - name: Verify installer artifact exists
        shell: bash
        run: |
          count=$(find desktop/release/ -maxdepth 1 -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No installer found in desktop/release/"
            echo "desktop/release/ contents:"
            ls -la desktop/release/ 2>/dev/null || echo "(release/ does not exist)"
            exit 1
          fi
          echo "Installer artifact OK ($count file(s) found):"
          find desktop/release/ -maxdepth 1 \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec ls -lh {} \;
          echo "Auto-updater metadata:"
          find desktop/release/ -maxdepth 1 -name "latest*.yml" -exec ls -lh {} \; || echo "(no latest*.yml — check publish step)"

      # ── Upload installer as GitHub Actions artifact (for direct download) ──
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_glob }}
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30
