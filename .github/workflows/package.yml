name: Package

# Triggered when a release tag is pushed (e.g. v0.7.1).
# Builds distributable installers for Windows, macOS, and Linux
# and uploads them as release assets.
#
# Required GitHub secrets:
#   (none for unsigned builds)
#   APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID  — macOS notarisation (optional)
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD            — Windows code signing (optional)
#
# Produced artifacts (stable download URLs via /releases/latest/download/):
#   Knovex-Setup-<version>.exe          Windows NSIS installer
#   Knovex-<version>.dmg                macOS DMG
#   Knovex-<version>.AppImage           Linux AppImage (portable)
#   knovex_<version>_amd64.deb          Linux Debian package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ─── Build on each target platform ──────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_glob: "desktop/release/*.exe"
            artifact_name: knovex-windows-installer
            backend_exe: backend/dist/knovex-backend/knovex-backend.exe

          - os: macos-latest
            platform: mac
            artifact_glob: "desktop/release/*.dmg"
            artifact_name: knovex-macos-dmg
            backend_exe: backend/dist/knovex-backend/knovex-backend

          - os: ubuntu-latest
            platform: linux
            artifact_glob: "desktop/release/*.AppImage"
            artifact_name: knovex-linux-appimage
            backend_exe: backend/dist/knovex-backend/knovex-backend

          - os: ubuntu-latest
            platform: linux-deb
            artifact_glob: "desktop/release/*.deb"
            artifact_name: knovex-linux-deb
            backend_exe: backend/dist/knovex-backend/knovex-backend

    runs-on: ${{ matrix.os }}
    name: Package — ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python backend binary ──────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies + PyInstaller
        run: pip install --upgrade pip && pip install -r backend/requirements.txt pyinstaller

      - name: Build backend binary (PyInstaller)
        shell: bash
        run: |
          python -m PyInstaller backend/knovex-backend.spec \
            --distpath backend/dist \
            --workpath backend/build \
            --noconfirm
        env:
          PYTHONUNBUFFERED: "1"

      # ── CRITICAL: fail loudly if binary was not produced ──────────────────
      - name: Verify backend binary exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.backend_exe }}" ]; then
            echo "ERROR: Backend binary not found at ${{ matrix.backend_exe }}"
            echo "PyInstaller output directory contents:"
            ls -la backend/dist/ 2>/dev/null || echo "(dist/ does not exist)"
            exit 1
          fi
          echo "Backend binary OK: ${{ matrix.backend_exe }}"
          ls -lh "${{ matrix.backend_exe }}"
          echo "Full backend bundle:"
          ls -la backend/dist/knovex-backend/

      # ── Frontend build ────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm ci && npm run build

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux build deps
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libxtst6 libx11-xcb1 libxcb-dri3-0 \
            libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      # ── Electron packaging ────────────────────────────────────────────────
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Package with electron-builder (AppImage)
        if: matrix.platform == 'linux'
        working-directory: desktop
        run: npx electron-builder --linux AppImage --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package with electron-builder (deb)
        if: matrix.platform == 'linux-deb'
        working-directory: desktop
        run: npx electron-builder --linux deb --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package with electron-builder (win/mac)
        if: "!startsWith(matrix.platform, 'linux')"
        working-directory: desktop
        run: npm run build:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # ── Verify installer was produced ─────────────────────────────────────
      - name: Verify installer artifact exists
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=( ${{ matrix.artifact_glob }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No installer found matching ${{ matrix.artifact_glob }}"
            echo "desktop/release/ contents:"
            ls -la desktop/release/ 2>/dev/null || echo "(release/ does not exist)"
            exit 1
          fi
          echo "Installer artifact OK: ${files[0]}"
          ls -lh "${files[@]}"

      # ── Upload installer as artifact ──────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30

  # ─── Attach artifacts to GitHub Release ─────────────────────────────────────
  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List downloaded files
        run: find dist/ -type f | sort

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
