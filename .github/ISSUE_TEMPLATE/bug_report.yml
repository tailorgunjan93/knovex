name: Bug Report
description: Something in the Knovex app is not working as expected
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill this out completely so we can reproduce and fix it quickly.

  - type: input
    id: version
    attributes:
      label: Knovex version
      description: Shown in the sidebar rail footer, or Settings → About.
      placeholder: "e.g. 0.12.9"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Chat / Ask Knovex
        - Learn (lessons / animation / review)
        - Reader
        - Knowledge Base
        - Settings (providers / search / models)
        - Install / Update / Launch
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (if any)
      description: "Windows: %APPDATA%\\Knovex\\logs. Paste relevant lines."
      render: shell
